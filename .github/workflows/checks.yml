name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q shell.py desktop_apps.py fix-vnc.py sandbox scripts
      - name: Test safe installers
        run: python sandbox/test-installer.py
      - name: Validate shell scripts
        run: find . -name '*.sh' -exec sh -n {} \;
