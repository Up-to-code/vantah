# Same glass rendering, without window movement or fades.
backend = "xrender";
vsync = false;
use-damage = false;
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -8;
blur-method = "gaussian";
blur-size = 16;
blur-deviation = 5.0;
blur-background = true;
detect-client-opacity = true;
corner-radius = 12;
rules = (
  { match = "window_type = 'desktop'"; shadow = false; blur-background = false; corner-radius = 0; },
  { match = "window_type = 'dock'"; shadow = false; blur-background = true; corner-radius = 0; },
  { match = "name = 'vAntah — Dock'"; shadow = false; corner-radius = 24; },
  { match = "name = 'vAntah — Applications'"; shadow = false; corner-radius = 0; animations = (); },
  { match = "window_type = 'popup_menu'"; shadow = false; corner-radius = 0; animations = (); },
  { match = "window_type = 'tooltip'"; shadow = false; blur-background = false; corner-radius = 8; animations = (); }
);
