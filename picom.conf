# Native compositing: live background blur, window scaling, and fading.
# XRender keeps this usable without a GPU inside the Alpine VNC sandbox.
backend = "xrender";
vsync = false;
use-damage = false;
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -8;
blur-method = "gaussian";
blur-size = 16;
blur-deviation = 5.0;
blur-background = true;
blur-background-frame = false;
detect-client-opacity = true;
corner-radius = 12;
rules = (
  { match = "window_type = 'desktop'"; shadow = false; blur-background = false; corner-radius = 0; },
  { match = "window_type = 'dock'"; shadow = false; blur-background = true; corner-radius = 0; animations = (); },
  { match = "name = 'Alpine Shell — Dock'"; shadow = false; corner-radius = 24; },
  { match = "name = 'Alpine Shell — Applications'"; corner-radius = 18; }
);
animations = (
  { triggers = ["open", "show"]; preset = "appear"; duration = 0.26; scale = 0.94; },
  { triggers = ["close", "hide"]; preset = "disappear"; duration = 0.18; scale = 0.97; }
);
